# Configuration de la CLI Supabase pour le développement local (`supabase start`).
# En production, les mêmes réglages se font dans le tableau de bord Supabase
# (voir README : Authentication > Providers > Phone, et Settings > Auth).

project_id = "montfc"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
# Jeton d'accès court (15 min) : un téléphone déconnecté par la règle
# « un appareil actif » perd l'accès au plus tard 15 minutes après.
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "MonTFC : ton code est {{ .Code }}. Ne le partage avec personne."
max_frequency = "60s"

# Numéros de test : aucun SMS n'est envoyé, le code est fixe.
# À SUPPRIMER en production.
[auth.sms.test_otp]
243810000001 = "123456"

# Fournisseur SMS (Twilio pour démarrer ; voir README pour un fournisseur
# local via le « Send SMS Hook »). La clé reste dans les secrets.
[auth.sms.twilio]
enabled = false
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[auth.email]
# Pas de connexion par e-mail : étudiants et admins se connectent par
# téléphone (code SMS). Un admin est un compte ajouté à public.app_admins.
enable_signup = false
enable_confirmations = true

[functions.claim-device]
verify_jwt = true

[functions.payment-init]
verify_jwt = true

[functions.payment-status]
verify_jwt = true

# Appelée par l'agrégateur : pas de jeton utilisateur.
[functions.payment-webhook]
verify_jwt = false

# Vérification des achats Google Play (variante store).
[functions.verify-store-purchase]
verify_jwt = true
